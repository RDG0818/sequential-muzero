model:
  hidden_state_size: 128
  value_support_size: 20
  reward_support_size: 5
  fc_representation_layers:
  - 128
  fc_dynamic_layers:
  - 128
  fc_reward_layers:
  - 32
  fc_value_layers:
  - 32
  fc_policy_layers:
  - 32
  attention_type: transformer
  attention_layers: 1
  attention_heads: 1
  dropout_rate: 0.1
  proj_hid: 256
  proj_out: 256
  pred_hid: 64
  pred_out: 256
mcts:
  planner_mode: independent
  num_simulations: 50
  max_depth_gumbel_search: 10
  num_gumbel_samples: 10
  dirichlet_alpha: 0.3
  dirichlet_fraction: 0.25
  independent_argmax: true
train:
  num_envs: 32
  batch_size: 512
  warmup_episodes: 200
  num_actors: 0
  num_reanalyze_actors: 0
  checkpoint_dir: checkpoints_jax
